# 课设系统节点拓扑
# plugins.entry = "package.module:PluginClass"
# 演示网关见 gateway/（单进程装配）；下表用于多进程 RPC 扩展

nodes:
  echo_node:
    group: framework
    host: 127.0.0.1
    port: 8200
    plugins:
      echo:
        entry: examples.echo_plugin:EchoPlugin
        config:
          greeting: "pong"

  gateway_node:
    group: gateway
    host: 127.0.0.1
    port: 8300
    data_dir: data/demo
    plugins:
      # 演示模式由 gateway.app.build_demo_registry 直接装配
      # 分布式模式可在各业务节点用 entry 加载同名插件
      note:
        entry: examples.echo_plugin:EchoPlugin
        config:
          greeting: "gateway"

  file_mgmt_node:
    group: file_mgmt
    host: 127.0.0.1
    port: 8101
    data_dir: data/file_mgmt
    plugins:
      file_store:
        entry: plugins.file_mgmt.file_store:FileStorePlugin
        config: {}
      doc_parser:
        entry: plugins.file_mgmt.doc_parser:DocParserPlugin
        config:
          chunk_size: 160
          chunk_overlap: 24

  vector_db_node:
    group: vector_db
    host: 127.0.0.1
    port: 8102
    data_dir: data/vector_db
    plugins:
      embedder:
        entry: plugins.vector_db.embedder:EmbedderPlugin
        config:
          dim: 4096
      vector_store:
        entry: plugins.vector_db.vector_store:VectorStorePlugin
        config:
          dim: 4096
          # 打分权重：cosine 主导，keyword_coverage 作为与余弦正交的补充信号。
          # 调整任一权重后，编排层的拒答阈值必须重新标定（见 score_scale()）。
          w_cos: 0.75
          w_cov: 0.25

  kg_node:
    group: kg
    host: 127.0.0.1
    port: 8103
    data_dir: data/kg
    plugins:
      kg_builder:
        entry: plugins.kg.kg_builder:KgBuilderPlugin
        config: {}
      kg_query:
        entry: plugins.kg.kg_query:KgQueryPlugin
        config:
          max_nodes: 50

  qa_node:
    group: qa
    host: 127.0.0.1
    port: 8104
    data_dir: data/qa
    plugins:
      rag_retriever:
        entry: plugins.qa.retriever:RagRetrieverPlugin
        config:
          # 方案 C 薄封装：检索逻辑归位到 vector_db_node(8102)，
          # 本插件只做转发，对外接口不变。
          #
          # ⚠️ 配了下面的 url 后，qa_node 启动时会先调 8102 的 vector_store.info：
          #    未启动 vector_db_node 时 initialize 抛异常 → qa_node 直接启动失败。
          #    启动顺序：vector_db_node 先起，再起 qa_node。
          #    需要 qa_node 独立启动（不带向量库）时，把下面这行注释掉即可 ——
          #    此时自动创建本地 vector_store 实例（单进程 demo 用）。
          vector_store_url: "http://127.0.0.1:8102"
      fusion_qa:
        entry: plugins.qa.fusion:FusionQaPlugin
        config:
          top_k: 3
